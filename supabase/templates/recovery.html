<!doctype html>
<html>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #111;">
    <h2>Reset your Expense Tracker password</h2>
    <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3C87F7;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:600;">Reset password in the app</a></p>
    <p>Or enter this one-time code in the app:</p>
    <p style="font-size: 32px; letter-spacing: 8px; font-weight: 700; margin: 24px 0;">
      {{ .Token }}
    </p>
    <p>This code expires in one hour. If you did not request a reset, ignore this email.</p>
  </body>
</html>
